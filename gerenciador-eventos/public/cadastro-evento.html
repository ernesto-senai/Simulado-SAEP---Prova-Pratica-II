<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de evento | Gerenciador de eventos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1 class="logo"><a href="index.html">Gerenciador de eventos</a></h1>
    <nav class="menu" aria-label="Menu principal">
      <a href="cadastro-palestrante.html">Cadastro de palestrantes</a>
      <a href="cadastro-evento.html" class="ativo" aria-current="page">Cadastro de evento</a>
      <a href="index.html">Gerenciador de evento</a>
    </nav>
  </header>

  <main class="conteudo">
    <h2 id="titulo-pagina">Cadastro de evento</h2>

    <form id="form-evento" class="formulario" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="150" required>
        <span class="msg-erro" id="erro-nome"></span>
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" maxlength="255" required>
        <span class="msg-erro" id="erro-descricao"></span>
      </div>

      <div class="campo">
        <label for="local">Local</label>
        <input type="text" id="local" name="local" maxlength="150" required>
        <span class="msg-erro" id="erro-local"></span>
      </div>

      <div class="campo">
        <label for="palestrante">Palestrante</label>
        <select id="palestrante" name="palestrante" required>
          <option value="">Carregando palestrantes...</option>
        </select>
        <span class="msg-erro" id="erro-palestrante"></span>
      </div>

      <button type="submit" class="btn btn-primario">Cadastrar</button>
    </form>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/evento.js"></script>
</body>
</html>
